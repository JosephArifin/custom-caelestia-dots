font_family family="CommitMono"
bold_font family="CommitMono" style="Bold"
italic_font Maple Mono
bold_italic_font family="Maple Mono" style="Bold Italic"

font_size 20

cursor_trail 1
cursor_trail_decay 0.1 0.3

scrollback_lines 5000

window_padding_width 8

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
# include current-theme.conf
# END_KITTY_THEME

background_opacity 1.0
enable_background_blur yes
background_blur 32

dynamic_background_opacity yes

background_image none
background_tint 0.9

clipboard_control write-clipboard write-primary read-clipboard read-primary

map f2 kitten opacity_toggle.py
