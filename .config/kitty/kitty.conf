font_family family="JetBrainsMono Nerd Font Mono"
bold_font family="JetBrainsMono Nerd Font Mono"
italic_font family="VictorMono Nerd Font Mono" postscript_name="VictorMono NFM" style="SemiBold Italic" 
bold_italic_font family="VictorMono Nerd Font Mono" postscript_name="VictorMono NFM" style="Bold Italic"

font_size 20

cursor_trail 1
cursor_trail_decay 0.1 0.3

scrollback_lines 5000

window_padding_width 8

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
# include current-theme.conf
# END_KITTY_THEME

background_opacity 1.0
enable_background_blur yes
background_blur 32

dynamic_background_opacity yes

background_image none
background_tint 0.9

map f2 kitten opacity_toggle.py
